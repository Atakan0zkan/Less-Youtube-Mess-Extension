name: CI triage analysis

# ci.yml'deki deterministik [CI-TRIAGE] Issue'larına AI analizi ekler.
# Tetikleyici `issues: opened` — opencode action'ın resmi olarak desteklediği event
# (push/workflow_run desteklenmez: "Unsupported event type").
# Test job'ları AI'sız kalır; model seçimi sadece buradadır.
# Primer: opencode/muse-spark-1.3-contributor-free
# Yedek (elde tutulur): opencode/muse-spark-1.2-contributor-free

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  analyze:
    if: startsWith(github.event.issue.title, '[CI-TRIAGE]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Analyze failure (1.3 Spark, comment only, no code changes)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          # YEDEK MODEL (elde tutulur — otomatik fallback değildir):
          # model: opencode/muse-spark-1.2-contributor-free
          # Eğer 1.3 rate-limit/quota yerse yukarıdaki satırı primerle değiştir.
          use_github_token: true
          prompt: |
            You are a fail-only CI triage agent. Do NOT modify code, do NOT open PRs, do NOT push commits, do NOT open new issues.

            Context: this `[CI-TRIAGE]` issue was opened deterministically because the blocking `test` job
            (ubuntu-latest, Node 22, `npm test` unit/DOM + Playwright fixture E2E, all AI-free) failed.
            The issue body has the failed run URL and commit SHA.

            Do exactly this, once, as a single Turkish comment on THIS issue:
            1. Fetch the failed run's `test` job logs via the GitHub API.
            2. Identify the single most likely failing layer: static/syntax, unit/DOM (regression vs comprehensive), or fixture E2E.
            3. Comment in Turkish: failing step, short log excerpt (max 40 lines), likely cause
               (repo code vs fixture vs infra), and the single command to reproduce locally
               (`npm test` or `npm run test:e2e`). Do not blame live YouTube; live is a separate non-blocking job.
