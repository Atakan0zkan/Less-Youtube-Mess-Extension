name: CI

# Formül:
# - test: fixture only, BLOCKING (kırmızı = dur). Her push/PR + günlük.
# - live: gerçek YouTube (--live), NON-BLOCKING sinyal. Haftalık + manuel.
#   Dış dünya bozuldu diye build kırılmaz (alarm yorgunluğu önlemi).
# - triage: sadece test fail olursa uyanan AI'sız-test sonrası fail-only agent.
#   Test job'larında AI/model/API key YOK — dumb komutlar. Model seçimi
#   sadece triage job'unda.
#   Primer: opencode/muse-spark-1.3-contributor-free
#   Yedek (elde tutulur, yorumda): opencode/muse-spark-1.2-contributor-free

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '30 5 * * *' # daily fixture (UTC)
    - cron: '0 6 * * 1' # weekly live signal (Monday UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (fixture, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install deps (AI-free)
        run: npm install --no-audit --no-fund

      - name: Syntax + whitespace
        run: |
          node --check content.js
          node --check popup.js
          node --check page-audio-bridge.js
          node --check shared/constants.js
          git diff --check

      - name: Unit + DOM (AI-free, zero-dep)
        run: npm test

      - name: Install Chromium for fixture E2E
        run: npx playwright install --with-deps chromium

      - name: Fixture E2E (AI-free, deterministic)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  live:
    name: live (real YouTube, non-blocking signal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    # Haftalık + manuel: kota/rate-limit/kaldırılan video/bölge farkı yüzünden
    # sebepsiz kırmızı verir, bu yüzden merge'i engellemez.
    # Daily fixture cron'unda çalışmaz — sadece haftalık cron + manuel.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install deps (AI-free)
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Live YouTube signal
        id: live
        continue-on-error: true
        run: |
          export BROWSER_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          echo "Chromium: $BROWSER_PATH"
          node tests/browser-smoke.cjs --live

      - name: Open informational issue on live failure (no code blame)
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Live YouTube sinyali başarısız — ${new Date().toISOString().slice(0,10)} (bilgilendirme, build'i kırmaz)`;
            const body = [
              'Bu Issue **live (--live)** job\'undan otomatik açıldı.',
              '',
              '- Fixture `test` job\'u yeşilse kod suçlanmaz; dış dünya (kota, kaldırılan video, bölge, ağ) ölçülür.',
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Yapılacak: log\'a bak, gerekirse haftalık ritimde izle. Kodu değiştirme.',
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title, body });

  triage:
    name: fail-triage (1.3 Spark, fail-only)
    needs: [test]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run fail-triage agent (no code changes)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Primer model: 1.3 Spark (free).
          model: opencode/muse-spark-1.3-contributor-free
          # YEDEK MODEL (elde tutulur — iş bitince yorumda durur, otomatik fallback değildir):
          # model: opencode/muse-spark-1.2-contributor-free
          # Eğer 1.3 rate-limit/quota yerse yukarıdaki satırı primerle değiştir.
          use_github_token: true
          prompt: |
            You are a fail-only CI triage agent. Do NOT modify code, do NOT open PRs, do NOT push commits.

            Context: the blocking `test` job (ubuntu-latest, Node 22, `npm test` + Playwright fixture E2E, all AI-free) just failed.

            Do this exactly once:
            1. Read the failed `test` job logs for this run (node --test output, syntax checks, Playwright fixture failures).
            2. Identify the single most likely failing layer: static/syntax, unit/DOM (regression vs comprehensive), or fixture E2E.
            3. Open exactly ONE new GitHub Issue in Turkish with title prefix `[CI-TRIAGE]`, containing: failing job + step, short log excerpt (max 40 lines), likely cause (repo code vs fixture vs infra), and the single next command to reproduce locally (`npm test` or `npm run test:e2e`). Do not blame live YouTube; live is a separate non-blocking job.
            4. Exit. If an identical open `[CI-TRIAGE]` issue already exists for the same failure signature, comment there instead of opening a duplicate.
