name: CI

# Formül:
# - test: fixture only, BLOCKING (kırmızı = dur). Her push/PR + günlük.
# - live: gerçek YouTube (--live), NON-BLOCKING sinyal. Haftalık + manuel.
#   Dış dünya bozuldu diye build kırılmaz (alarm yorgunluğu önlemi).
# - triage: sadece test fail olursa uyanan AI'sız-test sonrası fail-only agent.
#   Test job'larında AI/model/API key YOK — dumb komutlar. Model seçimi
#   sadece triage job'unda.
#   Primer: opencode/muse-spark-1.3-contributor-free
#   Yedek (elde tutulur, yorumda): opencode/muse-spark-1.2-contributor-free

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '30 5 * * *' # daily fixture (UTC)
    - cron: '0 6 * * 1' # weekly live signal (Monday UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (fixture, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install deps (AI-free)
        run: npm install --no-audit --no-fund

      - name: Syntax + whitespace
        run: |
          node --check content.js
          node --check popup.js
          node --check page-audio-bridge.js
          node --check shared/constants.js
          git diff --check

      - name: Unit + DOM (AI-free, zero-dep)
        run: npm test

      # Proven harness: tests/browser-smoke.cjs drives real unpacked extension
      # via CDP in a disposable profile (sidebar/premium/transcript/popup).
      # Needs headed Chrome (extensions don't init headless) -> xvfb.
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@latest

      - name: Fixture E2E (AI-free, deterministic)
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a node tests/browser-smoke.cjs

  live:
    name: live (real YouTube, non-blocking signal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    # Haftalık + manuel: kota/rate-limit/kaldırılan video/bölge farkı yüzünden
    # sebepsiz kırmızı verir, bu yüzden merge'i engellemez.
    # Daily fixture cron'unda çalışmaz — sadece haftalık cron + manuel.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install deps (AI-free)
        run: npm install --no-audit --no-fund

      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@latest

      - name: Live YouTube signal
        id: live
        continue-on-error: true
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a node tests/browser-smoke.cjs --live

      - name: Open informational issue on live failure (no code blame)
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Live YouTube sinyali başarısız — ${new Date().toISOString().slice(0,10)} (bilgilendirme, build'i kırmaz)`;
            const body = [
              'Bu Issue **live (--live)** job\'undan otomatik açıldı.',
              '',
              '- Fixture `test` job\'u yeşilse kod suçlanmaz; dış dünya (kota, kaldırılan video, bölge, ağ) ölçülür.',
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Yapılacak: log\'a bak, gerekirse haftalık ritimde izle. Kodu değiştirme.',
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title, body });

  triage:
    # push event'inde opencode action çalışmaz (sadece issue_comment/issues).
    # Bu job AI'sız ve deterministiktir: tek Türkçe [CI-TRIAGE] Issue açar/günceller.
    # AI analizi ayrı dosyadadır: .github/workflows/opencode-triage.yml
    # (issues: opened ile tetiklenir — resmi dokümanın desteklediği event).
    # Primer model: opencode/muse-spark-1.3-contributor-free
    # Yedek (orada yorumda): opencode/muse-spark-1.2-contributor-free
    name: fail-triage (deterministic issue, AI-free)
    needs: [test]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update [CI-TRIAGE] issue (Turkish, no AI)
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const title = `[CI-TRIAGE] test failed on ${sha}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Blocking `test` job\'u kırmızı. Bu Issue deterministik olarak CI tarafından açıldı (AI yok).',
              '',
              `- Commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              '- Yerelde tekrar üret: `npm test` (unit/DOM, 30 test) ve `npm run test:e2e` (Playwright fixture).',
              '- Live YouTube suçlanmaz; live ayrı non-blocking job\'dur.',
              '',
              'AI analizi (1.3 Spark) birazdan yorum olarak eklenecek; kod değiştirmez, PR açmaz.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const dup = open.find((i) => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: dup.number, body: `Tekrar fail: ${runUrl}` });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
