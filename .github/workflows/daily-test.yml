name: Daily Test

# Formül: blocking fixture + non-blocking live + fail-only AI triage.
# - offline-tests (BLOCKING): npm ci + offline komutlar. Ağ yok, tarayıcı yok.
# - e2e (BLOCKING): gerçek tarayıcı + mock'lu API (fixture intercept).
# - live-smoke (NON-BLOCKING, continue-on-error): gerçek YouTube (--live).
#   Kırmızı olsa bile merge kilitlenmez, sadece sinyal.
# - ai-triage (SADECE offline-tests fail olursa): 1.3 Spark, fail-only.
# Test job'larında AI/model/API key YOK — dumb komutlar. Model seçimi
# sadece ai-triage job'undadır.
# Primer: opencode/muse-spark-1.3-contributor-free
# Yedek model satırı ai-triage job'unda yorumdadır.

on:
  schedule:
    - cron: '0 4 * * *' # daily 07:00 TRT (UTC+3, no DST -> 04:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: offline-tests (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install deps (AI-free)
        run: npm ci --no-audit --no-fund

      - name: Syntax + whitespace (offline)
        run: |
          node --check content.js
          node --check popup.js
          node --check page-audio-bridge.js
          node --check shared/constants.js
          git diff --check

      - name: Unit + DOM (offline, zero-dep)
        run: npm test

  e2e:
    name: e2e (blocking, real browser + mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install deps (AI-free)
        run: npm ci --no-audit --no-fund

      # Proven harness: tests/browser-smoke.cjs drives the real unpacked
      # extension via CDP in a disposable profile; YouTube document requests
      # are intercepted with controlled fixtures (mocked API, no external net).
      # Headed Chrome needed (extensions don't init headless) -> xvfb.
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@latest

      - name: Fixture E2E (AI-free, deterministic)
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          BROWSER_NO_SANDBOX: '1'
        run: xvfb-run -a node tests/browser-smoke.cjs

  live-smoke:
    name: live-smoke (real YouTube, non-blocking signal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    # Kota/rate-limit/kaldırılan video/bölge farkı yüzünden sebepsiz kırmızı
    # verir; dış dünya ölçülür, bu yüzden merge'i engellemez.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install deps (AI-free)
        run: npm ci --no-audit --no-fund

      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@latest

      - name: Live YouTube signal
        id: live
        continue-on-error: true
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          BROWSER_NO_SANDBOX: '1'
        run: xvfb-run -a node tests/browser-smoke.cjs --live

      - name: Open informational issue on live failure (no code blame)
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Live YouTube signal failed — ${new Date().toISOString().slice(0,10)} (informational, does not block builds)`;
            const body = [
              'This issue was opened automatically by the **live-smoke** job.',
              '',
              '- If fixture jobs are green, do not blame the code; the outside world is measured here (quota, removed video, region, network).',
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Next step: check the log, watch the weekly rhythm if needed. Do not change code.',
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title, body });

  ai-triage:
    name: ai-triage (fail-only, deterministic)
    # Deterministic fallback (2026-09-20): the 1.3 Spark action is parked
    # because the Contributor-Free tier is app-only over the API-key path
    # (FreeTierError) even with billing on file. This step needs no model,
    # no API key, and cannot flake: it lists failed jobs via API and opens
    # ONE English issue. To re-enable AI, restore the opencode action with:
    #   model: opencode/muse-spark-1.3-contributor-free
    # (backup in comment: opencode/muse-spark-1.2-contributor-free)
    needs: [offline-tests, e2e, live-smoke]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update [CI-TRIAGE] issue (English, no AI)
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const title = `[CI-TRIAGE] test failed on ${sha}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: context.runId, per_page: 50,
            });
            const failed = data.jobs.filter((j) => j.conclusion === 'failure').map((j) => `- ${j.name}`);
            const body = [
              'A blocking test job failed. This issue was opened deterministically by CI (no AI).',
              '',
              `- Commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              '- Failed jobs:',
              ...failed,
              '- Reproduce locally: `npm test` (unit/DOM, offline) and `xvfb-run -a node tests/browser-smoke.cjs` (needs `BROWSER_PATH` to Chrome/Chromium).',
              '- live-smoke is non-blocking and never triggers triage; do not blame live YouTube.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const dup = open.find((i) => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: dup.number, body: `Still failing: ${runUrl}` });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
